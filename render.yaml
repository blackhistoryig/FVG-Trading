# Render blueprint — FREE PLAN version.
# Background Workers need a paid plan, so the runner deploys as a WEB service
# with a health endpoint (same pattern as the production equity bots in
# live_bot.py). A free external pinger (UptimeRobot, 5-min interval) prevents
# Render's 15-min spin-down, giving a 24/7 runner at $0.
#
# Deploy: Render dashboard -> New -> Blueprint -> this repo (branch
# hackathon/fvg-copilot). Then set up UptimeRobot on the service URL.
#
# FREE-TIER CAVEAT: no persistent disk. State (agent_state.json, runs/) lives
# in the container and is lost on restart — the runner's reconcile layer
# rebuilds from the live Alpaca account every pass and adopts open positions
# with default caps, so restarts degrade gracefully, never dangerously.

services:
  - type: web
    name: fvg-copilot-runner
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    branch: hackathon/fvg-copilot
    healthCheckPath: /
    envVars:
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: DRY_RUN
        value: "true"
      - key: SIGNAL_SOURCE
        value: live_bot
      - key: SYMBOLS
        value: SPY,QQQ,XLV,XLF,IWM
      - key: SCAN_INTERVAL_SEC
        value: "300"
      - key: ENFORCE_INTERVAL_SEC
        value: "60"
      - key: MAX_DAILY_TRADES
        value: "4"
